<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Адмін-панель — Ліцей №2</title><link rel="stylesheet" href="/admin.css"></head><body><div id="app"></div><script>
const A=document.querySelector("#app"),$=s=>document.querySelector(s);let data;
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function j(u,o){let r=await fetch(u,o);let x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||"Помилка");return x}
async function init(){let me=await j("/api/me");if(!me.loggedIn)return login();data=await j("/api/content");render()}
function login(){A.innerHTML='<main class="login"><div class="box"><h1>Адмін-панель</h1><p>Верхівцевський ліцей №2</p><input id="l" placeholder="Логін" value="admin"><input id="p" placeholder="Пароль" type="password"><button onclick="doLogin()">Увійти</button><small id="err"></small></div></main>'}
async function doLogin(){try{await j("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login:$("#l").value,password:$("#p").value})});init()}catch(e){$("#err").textContent=e.message}}
function render(){A.innerHTML='<header><b>⚙️ Ліцей №2 — Адмін</b><div><a href="/">Сайт</a><button onclick="logout()">Вийти</button></div></header><main class="wrap"><section class="panel"><h2>Сайт та SEO</h2><div id="site"></div><button onclick="saveSite()">Зберегти зміни</button></section><section class="panel"><h2>Новина</h2><div class="form"><input id="nt" placeholder="Заголовок"><textarea id="nb" placeholder="Текст"></textarea><input id="nu" placeholder="Посилання (необов’язково)"><button onclick="addNews()">Додати</button></div><div id="news"></div></section><section class="panel"><h2>Документ</h2><form id="df"><input name="title" placeholder="Назва документа"><input type="file" name="document"><button>Завантажити</button></form><div id="docs"></div></section><section class="panel"><h2>Потреба</h2><input id="needt" placeholder="Назва"><textarea id="needb" placeholder="Опис"></textarea><button onclick="addNeed()">Додати</button><div id="needs"></div></section><section class="panel"><h2>Фото</h2><form id="pf"><input name="title" placeholder="Підпис"><input type="file" name="photo" accept="image/*"><button>Завантажити</button></form><div id="photos" class="photos"></div></section><section class="panel"><h2>Пароль</h2><input id="old" type="password" placeholder="Старий пароль"><input id="newp" type="password" placeholder="Новий пароль"><button onclick="changePass()">Змінити пароль</button></section></main>';fillSite();fillLists()}
function fields(o){return Object.entries(o).map(([k,v])=>`<label>${esc(k)}<input data-k="${esc(k)}" value="${esc(v||"")}"></label>`).join("")}
function fillSite(){const s=data.site;$("#site").innerHTML=fields(s)}
async function saveSite(){let b={};document.querySelectorAll("#site [data-k]").forEach(x=>b[x.dataset.k]=x.value);data.site=await j("/api/site",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});alert("Збережено")}
function listBlock(arr,id,del,show){$(id).innerHTML=arr.map(x=>`<article><b>${esc(x.title||"Без назви")}</b><p>${esc(x.text||"")}</p>${show(x)} <button class="danger" onclick="${del}('${x.id}')">Видалити</button></article>`).join("")||"<p>Поки порожньо.</p>"}
function fillLists(){listBlock(data.news,"#news","delNews",x=>x.url?`<a href="${esc(x.url)}" target="_blank">посилання</a>`:"");listBlock(data.docs,"#docs","delDoc",x=>`<a href="${esc(x.url)}" target="_blank">відкрити</a>`);listBlock(data.needs,"#needs","delNeed",()=> "");$("#photos").innerHTML=data.photos.map(x=>`<figure><img src="${esc(x.url)}"><figcaption>${esc(x.title)}</figcaption><button class="danger" onclick="delPhoto('${x.id}')">Видалити</button></figure>`).join("")||"<p>Фото ще не завантажені.</p>"}
async function addNews(){await j("/api/news",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("#nt").value,text:$("#nb").value,url:$("#nu").value})});data=await j("/api/content");fillLists();$("#nt").value=$("#nb").value=$("#nu").value=""}
async function addNeed(){await j("/api/needs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("#needt").value,text:$("#needb").value})});data=await j("/api/content");fillLists();$("#needt").value=$("#needb").value=""}
async function delNews(id){await j("/api/news/"+id,{method:"DELETE"});data=await j("/api/content");fillLists()}async function delDoc(id){await j("/api/docs/"+id,{method:"DELETE"});data=await j("/api/content");fillLists()}async function delNeed(id){await j("/api/needs/"+id,{method:"DELETE"});data=await j("/api/content");fillLists()}async function delPhoto(id){await j("/api/photo/"+id,{method:"DELETE"});data=await j("/api/content");fillLists()}
$("#app").addEventListener("submit",async e=>{if(e.target.id==="df"||e.target.id==="pf"){e.preventDefault();await j(e.target.id==="df"?"/api/document-upload":"/api/photo",{method:"POST",body:new FormData(e.target)});data=await j("/api/content");fillLists();e.target.reset()}})
async function changePass(){try{await j("/api/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({old:$("#old").value,new:$("#newp").value})});alert("Пароль змінено");$("#old").value=$("#newp").value=""}catch(e){alert(e.message)}}
async function logout(){await j("/api/logout",{method:"POST"});init()}init();
</script></body></html>
